services:
  api:
    build: .
    image: anyaa-kitchen-agent
    ports:
      - "${APP_PORT:-8010}:8000"  # host port; pick a free one
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/household.db
      LOG_PATH: /app/logs/events.jsonl
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Live code for development; uvicorn reloads on change.
      - ./app:/app/app:ro
      - ./web:/app/web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
